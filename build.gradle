// create a runnable jar with jar dependencies stored in lib subdirectory
tasks.whenTaskAdded { task ->
    ['startScripts', 'distTar'].each { String skipTaskName ->
        if (task.name.contains(skipTaskName)) {
            task.enabled = false
        }
    }
}
apply plugin: 'java'
apply plugin: 'application'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Read source files as UTF-8 regardless of the build machine's default charset, so any non-ASCII
// in string literals is compiled correctly (avoids mojibake in generated output, e.g. em dashes).
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
mainClassName = 'edu.mcw.rgd.chatBotEmbed.Manager'
String myAppName = 'rgd-ai-chatbot-rag-pipeline'

project.archivesBaseName = myAppName

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-dbcp2:2.8.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.21.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'com.oracle.database.jdbc:ojdbc10:19.20.0.0'
    implementation 'org.springframework:spring-beans:6.0.13'
    implementation 'org.springframework:spring-jdbc:6.0.13'

    // --mode embed: read markdown, chunk, embed, write pgvector rows
    implementation 'com.knuddels:jtokkit:1.1.0'                       // cl100k_base token counting (chunker)
    implementation 'org.postgresql:postgresql:42.7.7'                 // Postgres/pgvector JDBC driver
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2' // embedding request/response JSON

    implementation fileTree(dir: 'lib', include: '*.jar')
}

jar {
    manifest {
        attributes(
                'Built-By': System.getProperty('user.name'),
                'Built-Date': new Date(),
                'Built-JDK': System.getProperty('java.version'),
                'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' '),
                'Main-Class': mainClassName
        )
    }
}

distributions {
    main {
        distributionBaseName = myAppName
    }
}

task createDistro(type: Copy) {
    def zipFile = file('build/distributions/'+myAppName+'.zip')
    def outputDir = file("build/install")

    from zipTree(zipFile)
    into outputDir
}
createDistro.dependsOn assembleDist
